kind = "web"
previewPath = "/"
title = "EDENGROUPES Storefront"
description = "A premium Algerian e-commerce frontend for professional tools, workshop equipment, and practical products, with catalog discovery by category, profession, brand, and search."
version = "1.0.0"
id = "artifacts/edengroupes-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25251

[services.development]
run = "pnpm --filter @workspace/edengroupes-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edengroupes-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/edengroupes-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25251"
BASE_PATH = "/"
